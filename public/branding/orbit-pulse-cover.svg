<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ship.live — Great work. Shared momentum.</title>
  <desc id="desc">Dark brand cover with the Orbit Pulse logo and sweeping contribution paths.</desc>
