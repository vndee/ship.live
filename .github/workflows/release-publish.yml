name: Release publish

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate stable release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_revision: ${{ steps.release.outputs.previous_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download the untrusted signal from the exact triggering run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signal
          path: ${{ runner.temp }}/release-signal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Bind release tag to event commit and main history
        id: release
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$SOURCE_CONCLUSION" = success
          test "$SOURCE_EVENT" = release
          # The producer and all its files are hostile. Parse just one bounded
          # ASCII record using inline trusted code, outside the source checkout.
          RELEASE_TAG="$(python3 -I - "$RUNNER_TEMP/release-signal" <<'PY'
          import pathlib, re, sys
          directory = pathlib.Path(sys.argv[1])
          assert not directory.is_symlink() and directory.is_dir()
          entries = list(directory.iterdir())
          assert len(entries) == 1 and entries[0].name == 'tag.txt'
          record = entries[0]
          assert not record.is_symlink() and record.is_file()
          assert 1 <= record.stat().st_size <= 128
          data = record.read_bytes()
          assert re.fullmatch(rb'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n', data)
          print(data[:-1].decode('ascii'))
          PY
          )"
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' --tags
          # No tag-controlled code or npm lifecycle runs before these checks.
          # The validator itself must come from a workflow revision in main.
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          tagged_release="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tagged_release" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$tagged_release" origin/main
          # Require the current release record, not producer-supplied metadata.
          gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/github-release.json"
          jq -e --arg tag "$RELEASE_TAG" '
            type == "object" and .tag_name == $tag and
            .draft == false and .prerelease == false and
            (.published_at | type == "string" and length > 0) and
            (.target_commitish | type == "string" and length > 0)
          ' "$RUNNER_TEMP/github-release.json" > /dev/null
          RELEASE_TARGET="$(jq -er '.target_commitish' "$RUNNER_TEMP/github-release.json")"
          # Read package metadata as JSON bytes; never import release files.
          git show "$tagged_release:package.json" > "$RUNNER_TEMP/release-package.json"
          package_version="$(node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (typeof p.version !== "string") process.exit(1); process.stdout.write(p.version)' "$RUNNER_TEMP/release-package.json")"
          node deploy/release-policy.mjs \
            --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" \
            --release-sha "$RELEASE_SHA" --main-ref origin/main \
            --package-version "$package_version" \
            > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`, 'utf8'));
          const stable = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const compare = (left, right) => {
            const a = left.slice(1).split('.').map(BigInt);
            const b = right.slice(1).split('.').map(BigInt);
            for (let index = 0; index < 3; index++) {
              if (a[index] !== b[index]) return a[index] < b[index] ? -1 : 1;
            }
            return 0;
          };
          const previous = execFileSync('git', ['tag', '--merged', release.revision], { encoding: 'utf8' })
            .trim().split('\n').filter(tag => stable.test(tag) && compare(tag, release.tag) < 0)
            .sort(compare).at(-1) ?? '';
          const previousRevision = previous
            ? execFileSync('git', ['rev-parse', `refs/tags/${previous}^{commit}`], { encoding: 'utf8' }).trim()
            : '';
          appendFileSync(process.env.GITHUB_OUTPUT,
            `tag=${release.tag}\nrevision=${release.revision}\nprevious_tag=${previous}\nprevious_revision=${previousRevision}\n`);
          NODE

  checks:
    name: Format, deployment policy, PostgreSQL tests, and build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ship_live_test
          POSTGRES_PASSWORD: ship_live_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship_live_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ship_live_test:ship_live_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:deploy-policy
      - run: npm run test:db
      - run: npm run build

  browser:
    name: Browser tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  publish:
    name: Build, verify compatibility, and publish immutable image
    needs: [validate, checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ship_live_test
          POSTGRES_PASSWORD: ship_live_test
          POSTGRES_DB: ship_live_compatibility
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship_live_test -d ship_live_compatibility"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE_REPOSITORY: ghcr.io/vndee/ship.live
      VERSION: ${{ needs.validate.outputs.tag }}
      REVISION: ${{ needs.validate.outputs.revision }}
      PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
      PREVIOUS_REVISION: ${{ needs.validate.outputs.previous_revision }}
      LOCAL_IMAGE: ship-live-release:${{ needs.validate.outputs.revision }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install digest-preserving registry client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
      - name: Build the current runtime once and load the same result locally
        id: build
        run: |
          set -euo pipefail
          node --import tsx deploy/image-metadata.mjs "$VERSION" "$REVISION" > "$RUNNER_TEMP/release-metadata"
          # The metadata helper emits only validated version, SHA, and integers.
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/release-metadata"
          docker buildx build --load --platform linux/amd64 --target runtime \
            --provenance=false --sbom=false \
            --tag "$LOCAL_IMAGE" \
            --output "type=oci,dest=$RUNNER_TEMP/release-image.tar" \
            --build-arg "RELEASE_VERSION=$VERSION" \
            --build-arg "VCS_REVISION=$REVISION" \
            --build-arg "SCHEMA_VERSION=$SCHEMA_VERSION" \
            --build-arg "MAX_SCHEMA_VERSION=$MAX_SCHEMA_VERSION" .
          skopeo inspect --raw "oci-archive:$RUNNER_TEMP/release-image.tar" > "$RUNNER_TEMP/local-manifest.json"
          test "$(jq -er '.config.digest' "$RUNNER_TEMP/local-manifest.json")" = \
            "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Smoke-test the loaded current image
        id: smoke
        run: SHIP_LIVE_TEST_IMAGE="$LOCAL_IMAGE" npm run test:docker
      - name: Prove previous-release reads and writes survive the migrated database
        id: compatibility
        env:
          DATABASE_URL: postgres://ship_live_test:ship_live_test@127.0.0.1:5432/ship_live_compatibility
        run: |
          set -euo pipefail
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo 'first stable release: no previous image compatibility target'
            [[ "$PRODUCTION_DEPLOY_ENABLED" != true ]] || {
              echo 'First stable release requires bootstrap with production deployment disabled' >&2
              exit 1
            }
            exit 0
          fi
          previous_source="$RUNNER_TEMP/previous-release"
          previous_image="ship-live-previous:$REVISION"
          test "$(git rev-parse "refs/tags/$PREVIOUS_TAG^{commit}")" = "$PREVIOUS_REVISION"
          git worktree add --detach "$previous_source" "refs/tags/$PREVIOUS_TAG"
          docker buildx build --load --platform linux/amd64 --target runtime \
            --tag "$previous_image" "$previous_source"
          docker run --rm --network host -e DATABASE_URL --entrypoint node \
            --mount "type=bind,source=$PWD/deploy/previous-store-probe.mjs,target=/app/previous-store-probe.mjs,readonly" \
            "$previous_image" --import tsx /app/previous-store-probe.mjs seed
          docker run --rm --network host -e DATABASE_URL "$LOCAL_IMAGE" npm run db:migrate
          docker run --rm --network host -e DATABASE_URL --entrypoint node \
            --mount "type=bind,source=$PWD/deploy/previous-store-probe.mjs,target=/app/previous-store-probe.mjs,readonly" \
            "$previous_image" --import tsx /app/previous-store-probe.mjs verify
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard immutable tags, publish tested bytes, and verify the remote digest
        id: publish
        run: |
          set -euo pipefail
          expected_digest="$(skopeo manifest-digest "$RUNNER_TEMP/local-manifest.json")"
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          # Inspect both destinations before writing either one. Only a registry
          # missing-manifest/name response is absence; auth/network errors fail.
          for tag in "$VERSION" "sha-$REVISION"; do
            if skopeo inspect --authfile "$auth_file" --raw "docker://$IMAGE_REPOSITORY:$tag" \
              > "$RUNNER_TEMP/existing-manifest.json" 2> "$RUNNER_TEMP/registry-error"; then
              existing_digest="$(skopeo manifest-digest "$RUNNER_TEMP/existing-manifest.json")"
              if [[ "$existing_digest" != "$expected_digest" ]]; then
                echo "Refusing to overwrite immutable tag $tag" >&2
                exit 1
              fi
            elif ! grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN|manifest unknown|name unknown' "$RUNNER_TEMP/registry-error"; then
              echo "Could not establish whether immutable tag $tag exists" >&2
              exit 1
            fi
          done
          for tag in "$VERSION" "sha-$REVISION"; do
            skopeo copy --preserve-digests --authfile "$auth_file" \
              "oci-archive:$RUNNER_TEMP/release-image.tar" "docker://$IMAGE_REPOSITORY:$tag"
            skopeo inspect --authfile "$auth_file" --raw "docker://$IMAGE_REPOSITORY:$tag" \
              > "$RUNNER_TEMP/remote-manifest.json"
            test "$(skopeo manifest-digest "$RUNNER_TEMP/remote-manifest.json")" = "$expected_digest"
          done
          skopeo inspect --authfile "$auth_file" --raw "docker://$IMAGE_REPOSITORY@$expected_digest" \
            > "$RUNNER_TEMP/remote-manifest.json"
          cmp "$RUNNER_TEMP/local-manifest.json" "$RUNNER_TEMP/remote-manifest.json"
          skopeo inspect --authfile "$auth_file" --config "docker://$IMAGE_REPOSITORY@$expected_digest" \
            | jq -e --arg version "$VERSION" --arg revision "$REVISION" '
              .architecture == "amd64" and .os == "linux" and
              .config.Labels["org.opencontainers.image.source"] == "https://github.com/vndee/ship.live" and
              .config.Labels["org.opencontainers.image.version"] == $version and
              .config.Labels["org.opencontainers.image.revision"] == $revision' > /dev/null
          echo "image=$IMAGE_REPOSITORY@$expected_digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy verified digest to production
    needs: [validate, checks, browser, publish]
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      deployment: false
    env:
      APP_IMAGE: ${{ needs.publish.outputs.image }}
      REVISION: ${{ needs.validate.outputs.revision }}
      VERSION: ${{ needs.validate.outputs.tag }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Verify public image access and send only its digest to forced SSH
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$APP_IMAGE" =~ ^ghcr\.io/vndee/ship\.live@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          umask 077
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/anonymous-registry.XXXXXX")"
          deployment_id=""
          report_status() {
            jq -n --arg state "$1" \
              --arg log_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{state: $state, log_url: $log_url, auto_inactive: false}' \
              > "$RUNNER_TEMP/deployment-status.json" || return
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --input "$RUNNER_TEMP/deployment-status.json" > /dev/null
          }
          finish() {
            local result=$? state=failure
            trap - EXIT
            if [[ "$result" == 0 ]]; then state=success; fi
            if [[ -n "$deployment_id" ]] && ! report_status "$state"; then
              echo 'Could not record final deployment status; reconcile the host and deployment record before retrying' >&2
              result=1
            fi
            rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$anonymous_config/config.json"
            rmdir "$anonymous_config"
            exit "$result"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$anonymous_config/config.json"
          env -u DOCKER_AUTH_CONFIG docker --config "$anonymous_config" manifest inspect "$APP_IMAGE" > /dev/null
          # workflow_run's SHA is main's workflow revision, not the release.
          # Track the already-validated release explicitly without auto-merging.
          jq -n --arg revision "$REVISION" --arg image "$APP_IMAGE" --arg tag "$VERSION" '
            {ref: $revision, auto_merge: false, required_contexts: [],
             environment: "production", production_environment: true,
             payload: {image: $image, tag: $tag}}
          ' > "$RUNNER_TEMP/deployment-request.json"
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/deployments" \
            --input "$RUNNER_TEMP/deployment-request.json" > "$RUNNER_TEMP/deployment-response.json"
          jq -e --arg revision "$REVISION" --arg image "$APP_IMAGE" --arg tag "$VERSION" '
            .sha == $revision and .ref == $revision and .environment == "production" and
            .payload.image == $image and .payload.tag == $tag and
            (.id | type == "number" and . > 0 and . == floor)
          ' "$RUNNER_TEMP/deployment-response.json" > /dev/null
          deployment_id="$(jq -er '.id' "$RUNNER_TEMP/deployment-response.json")"
          [[ "$deployment_id" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          report_status in_progress
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 0600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
          ssh -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ForwardAgent=no \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -i "$RUNNER_TEMP/deploy_key" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$APP_IMAGE"
